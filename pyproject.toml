[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-select"
version = "0.1.0"
description = "Leakage-safe monthly directional forecasting with selective prediction"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "catboost>=1.2",
  "pyarrow>=12",
  "PyYAML>=6",
  "matplotlib>=3.7",
]

[project.scripts]
forecast-select = "forecast_select.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

