[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-select"
version = "1.0.0"
description = "Leakage-safe monthly directional forecasting with readable model selection"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "scikit-learn>=1.3",
  "pyarrow>=12",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.15,<0.16",
]

[project.scripts]
forecast-select = "forecast_select.cli:main"
forecast-select-research = "forecast_select.research_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
norecursedirs = ["archive", ".git", ".pytest_cache", ".ruff_cache"]

[tool.ruff]
target-version = "py311"
line-length = 88
